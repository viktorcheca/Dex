<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personaje · Aionia</title>

  <link rel="stylesheet" href="style.css" />
  <script src="data-personajes.js"></script>

  <style>
    .site-header {
      position: sticky; top: 0; z-index: 40;
      backdrop-filter: blur(10px);
      background: rgba(7,16,29,.82);
      border-bottom: 1px solid rgba(255,255,255,.07);
    }

    .site-nav {
      max-width: 1400px; margin: 0 auto; padding: 15px 22px;
      display: flex; align-items: center; justify-content: space-between; gap: 18px;
    }

    .site-brand {
      color: var(--text); text-decoration: none; font-size: 20px;
      font-weight: 900; letter-spacing: .13em;
    }

    .site-links { display: flex; gap: 7px; flex-wrap: wrap; }

    .site-links a, .site-links span {
      padding: 8px 11px; border-radius: 10px; color: #cbd6ec;
      text-decoration: none; font-size: 14px; font-weight: 750;
    }

    .site-links a:hover, .site-links .active {
      background: rgba(255,255,255,.08); color: #fff;
    }

    .character-page {
      max-width: 1120px; margin: 0 auto; padding: 36px 22px 90px;
    }

    .back-link {
      display: inline-block; margin-bottom: 24px; color: #9fb1d1;
      text-decoration: none; font-weight: 800;
    }

    .back-link:hover { color: #fff; }

    .character-sheet {
      display: grid; grid-template-columns: minmax(300px,.78fr) minmax(0,1.22fr);
      gap: 30px; align-items: stretch;
    }

    .character-image-box {
      min-height: 590px; position: relative; overflow: hidden;
      border-radius: 28px; border: 1px solid rgba(255,255,255,.08);
      background:
        radial-gradient(circle at 50% 35%, rgba(211,135,242,.16), transparent 36%),
        #0b1327;
      box-shadow: var(--shadow);
    }

    .character-image-box img {
      width: 100%; height: 100%; display: block;
      object-fit: contain; object-position: center bottom;
    }

    .character-image-box.no-image img { display: none; }

    .character-image-box.no-image::after {
      content: "AIONIA"; position: absolute; inset: 0; display: grid;
      place-items: center; color: rgba(255,255,255,.10);
      font-size: clamp(34px,8vw,72px); font-weight: 950; letter-spacing: .18em;
    }

    .character-info {
      padding: 38px; border-radius: 28px;
      border: 1px solid rgba(255,255,255,.08);
      background: linear-gradient(180deg,var(--card),var(--card-2));
      box-shadow: var(--shadow);
      display: flex; flex-direction: column; justify-content: center;
    }

    .character-id {
      margin: 0 0 12px; color: #d99af3; font-size: 13px;
      font-weight: 900; letter-spacing: .15em; text-transform: uppercase;
    }

    .character-info h1 {
      margin: 0; font-size: clamp(48px,7vw,82px);
      letter-spacing: -.045em; line-height: .92;
    }

    .divider {
      width: 70px; height: 3px; margin: 28px 0;
      border-radius: 999px; background: rgba(217,154,243,.65);
    }

    .character-description {
      margin: 0; color: #b7c3d9; font-size: 18px;
      line-height: 1.8; white-space: pre-line;
    }

    .empty {
      padding: 28px; border-radius: 20px;
      border: 1px solid rgba(255,255,255,.07);
      background: var(--card); color: var(--muted);
    }

    @media (max-width: 820px) {
      .character-sheet { grid-template-columns: 1fr; }
      .character-image-box { min-height: 480px; }
    }

    @media (max-width: 620px) {
      .site-nav { align-items: flex-start; flex-direction: column; }
      .character-page { padding: 28px 16px 70px; }
      .character-info { padding: 26px; }
      .character-image-box { min-height: 420px; }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <nav class="site-nav" aria-label="Navegación principal">
      <a class="site-brand" href="index.html">AIONIA</a>
      <div class="site-links">
        <a href="index.html">Inicio</a>
        <a href="dex.html">Pokédex</a>
        <a class="active" href="personajes.html">Personajes</a>
        <a href="lugares.html">Lugares</a>
      </div>
    </nav>
  </header>

  <main class="character-page">
    <a class="back-link" href="personajes.html">← Volver a Personajes</a>
    <div id="content"></div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const id = String(params.get('id') || '').toUpperCase();
    const characters = Array.isArray(window.PERSONAJES) ? window.PERSONAJES : [];
    const character = characters.find(c => String(c.id).toUpperCase() === id);
    const content = document.getElementById('content');

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&','&amp;').replaceAll('<','&lt;')
        .replaceAll('>','&gt;').replaceAll('"','&quot;')
        .replaceAll("'",'&#039;');
    }

    if (!character) {
      document.title = 'Personaje no encontrado · Aionia';
      content.innerHTML = `
        <div class="empty">
          <h1>Personaje no encontrado</h1>
          <p>No existe ningún personaje con el código ${escapeHtml(id || 'indicado')}.</p>
        </div>`;
    } else {
      document.title = `${character.nombre} · Aionia`;

      content.innerHTML = `
        <section class="character-sheet">
          <div class="character-image-box" id="characterImageBox">
            <img id="characterImage"
                 src="${escapeHtml(character.imagen || '')}"
                 alt="${escapeHtml(character.nombre)}">
          </div>

          <div class="character-info">
            <p class="character-id">${escapeHtml(character.id)}</p>
            <h1>${escapeHtml(character.nombre)}</h1>
            <div class="divider"></div>
            <p class="character-description">${escapeHtml(character.descripcion || 'Sin descripción disponible.')}</p>
          </div>
        </section>
      `;

      const img = document.getElementById('characterImage');
      const box = document.getElementById('characterImageBox');
      img.addEventListener('error', () => box.classList.add('no-image'), { once: true });
      if (img.complete && img.naturalWidth === 0) box.classList.add('no-image');
    }
  </script>
</body>
</html>
