<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ficha Pokémon – Aionia Dex</title>
  <link rel="stylesheet" href="style.css">
  <script src="data.js"></script>

  <style>
    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(10px);
      background: rgba(7,16,29,.82);
      border-bottom: 1px solid rgba(255,255,255,.07);
    }

    .site-nav {
      max-width: 1400px;
      margin: 0 auto;
      padding: 15px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .site-brand {
      color: var(--text);
      text-decoration: none;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: .13em;
    }

    .site-links {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      align-items: center;
    }

    .site-links a,
    .site-links span {
      padding: 8px 11px;
      border-radius: 10px;
      color: #cbd6ec;
      text-decoration: none;
      font-size: 14px;
      font-weight: 750;
    }

    .site-links a:hover,
    .site-links .active {
      background: rgba(255,255,255,.08);
      color: #fff;
    }

    .site-links .disabled {
      opacity: .38;
    }

    .pokemon-right {
      position: sticky;
      top: 92px;
    }

    .pokemon-nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 40;

      width: 46px;
      height: 58px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 14px;
      background: rgba(7,16,29,.9);
      color: #eef5ff;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 30px;
      font-weight: 900;
      line-height: 1;
      text-decoration: none;
      box-shadow: 0 12px 28px rgba(0,0,0,.35);

      transition: transform .15s ease, background .15s ease, border-color .15s ease;
    }

    .pokemon-nav-arrow:hover {
      transform: translateY(-50%) scale(1.06);
      background: rgba(24,37,64,.97);
      border-color: rgba(255,255,255,.32);
    }

    .pokemon-nav-arrow.prev-pokemon { left: -60px; }
    .pokemon-nav-arrow.next-pokemon { right: -60px; }

    .pokemon-nav-arrow.hidden {
      display: none;
    }

    .pokemon-nav-caption {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: #8493ad;
      font-size: 12px;
    }

    .pokemon-nav-caption a {
      color: #9fb1d1;
      text-decoration: none;
    }

    .pokemon-nav-caption a:hover {
      color: #fff;
    }

    @media (max-width: 760px) {
      .site-nav {
        align-items: flex-start;
        flex-direction: column;
      }

      .pokemon-right {
        position: static;
      }

      .pokemon-nav-arrow.prev-pokemon {
        left: 10px;
        top: auto;
        bottom: 10px;
        transform: none;
      }

      .pokemon-nav-arrow.next-pokemon {
        right: 10px;
        top: auto;
        bottom: 10px;
        transform: none;
      }

      .pokemon-nav-arrow:hover {
        transform: scale(1.05);
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <nav class="site-nav" aria-label="Navegación principal">
      <a class="site-brand" href="index.html">AIONIA</a>
      <div class="site-links">
        <a href="index.html">Inicio</a>
        <a class="active" href="dex.html">Pokédex</a>
        <a href="personajes.html">Personajes</a>
        <a href="lugares.html">Lugares</a>
      </div>
    </nav>
  </header>

  <main class="pokemon-page">
    <a class="back" href="dex.html">← Volver a la Dex</a>

    <section class="pokemon-sheet">
      <div class="pokemon-left">
        <div class="pokemon-number" id="pokemonNumber"></div>
        <h1 id="pokemonName"></h1>
        <div id="pokemonTypes" class="chips"></div>
        <h2 id="pokemonDefinition"></h2>

        <section class="panel">
          <h3>Biología</h3>
          <p id="pokemonDex"></p>
        </section>

        <section class="panel">
          <h3>Stats base</h3>
          <div id="pokemonStats" class="stats-list"></div>
        </section>

        <section class="panel" id="factsPanel">
          <h3>Curiosidades</h3>
          <p id="pokemonFacts"></p>
        </section>

        <section class="panel" id="evolutionPanel">
          <h3>Línea evolutiva</h3>
          <div id="pokemonEvolutionLine" class="evolution-line"></div>
        </section>

        <section class="panel muted-panel">
          <h3>Área / Hábitat</h3>
          <p>Próximamente</p>
        </section>
      </div>

      <aside class="pokemon-right">
        <div class="pokemon-image-box">
          <a id="prevPokemon" class="pokemon-nav-arrow prev-pokemon" aria-label="Pokémon anterior" title="Pokémon anterior">‹</a>

          <button
            id="shinyToggle"
            class="shiny-toggle"
            type="button"
            aria-label="Mostrar versión shiny"
            title="Mostrar versión shiny"
            style="display:none;"
          >✦</button>

          <button class="form-arrow form-prev" id="prevForm" type="button" aria-label="Forma anterior">‹</button>
          <img id="pokemonImg" alt="Imagen Pokémon">
          <button class="form-arrow form-next" id="nextForm" type="button" aria-label="Forma siguiente">›</button>

          <a id="nextPokemon" class="pokemon-nav-arrow next-pokemon" aria-label="Pokémon siguiente" title="Pokémon siguiente">›</a>
        </div>

        <div class="form-selector" id="formSelector">
          <div class="form-label">Forma</div>
          <div class="form-name" id="formName"></div>
        </div>

        <div class="pokemon-nav-caption">
          <a id="prevPokemonCaption"></a>
          <a id="nextPokemonCaption"></a>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = Number(params.get("id"));
    const pokemon = POKEMON.find(p => p.id === id);

    function typeClass(t) {
      return 'type-' + String(t || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/\s+/g, '');
    }

    function getPokemonForms(p) {
      const forms = Array.isArray(p?.forms)
        ? p.forms.filter(f => f && f.image)
        : [];

      if (forms.length) return forms;

      return [{
        name: "Normal",
        image: p?.image || "assets/img/_placeholder.png"
      }];
    }

    function getDisplayImage(p) {
      return getPokemonForms(p)[0]?.image || p?.image || "assets/img/_placeholder.png";
    }

    function getShinyPath(imagePath) {
      const dotIndex = imagePath.lastIndexOf(".");
      if (dotIndex === -1) return `${imagePath}_shiny`;
      return `${imagePath.slice(0, dotIndex)}_shiny${imagePath.slice(dotIndex)}`;
    }

    function imageExists(src) {
      return new Promise(resolve => {
        const testImage = new Image();
        testImage.onload = () => resolve(true);
        testImage.onerror = () => resolve(false);
        testImage.src = src;
      });
    }

    function orderedPokemon() {
      return [...POKEMON]
        .filter(p => Number.isFinite(Number(p.id)))
        .sort((a, b) => Number(a.id) - Number(b.id));
    }

    function setupPokemonNavigation(current) {
      const ordered = orderedPokemon();
      const currentIndex = ordered.findIndex(p => p.id === current.id);

      const previous = currentIndex > 0 ? ordered[currentIndex - 1] : null;
      const next = currentIndex >= 0 && currentIndex < ordered.length - 1
        ? ordered[currentIndex + 1]
        : null;

      const prevArrow = document.getElementById("prevPokemon");
      const nextArrow = document.getElementById("nextPokemon");
      const prevCaption = document.getElementById("prevPokemonCaption");
      const nextCaption = document.getElementById("nextPokemonCaption");

      if (previous) {
        const href = `pokemon.html?id=${previous.id}`;
        prevArrow.href = href;
        prevArrow.title = `Anterior: #${String(previous.id).padStart(3,"0")} ${previous.name}`;
        prevCaption.href = href;
        prevCaption.textContent = `← #${String(previous.id).padStart(3,"0")} ${previous.name}`;
      } else {
        prevArrow.classList.add("hidden");
        prevCaption.style.visibility = "hidden";
      }

      if (next) {
        const href = `pokemon.html?id=${next.id}`;
        nextArrow.href = href;
        nextArrow.title = `Siguiente: #${String(next.id).padStart(3,"0")} ${next.name}`;
        nextCaption.href = href;
        nextCaption.textContent = `#${String(next.id).padStart(3,"0")} ${next.name} →`;
      } else {
        nextArrow.classList.add("hidden");
        nextCaption.style.visibility = "hidden";
      }

      return { previous, next };
    }

    if (!pokemon) {
      document.body.innerHTML += `
        <main class="pokemon-page">
          <a class="back" href="dex.html">← Volver a la Dex</a>
          <h1>Pokémon no encontrado</h1>
        </main>`;
    } else {
      document.title = `#${String(pokemon.id).padStart(3, "0")} ${pokemon.name} – Aionia Dex`;

      document.getElementById("pokemonNumber").textContent = `#${String(pokemon.id).padStart(3, "0")}`;
      document.getElementById("pokemonName").textContent = pokemon.name;
      document.getElementById("pokemonDefinition").textContent = pokemon.definition || "";
      document.getElementById("pokemonDex").textContent = pokemon.dex_draft || "—";

      const navigation = setupPokemonNavigation(pokemon);

      const img = document.getElementById("pokemonImg");
      const formSelector = document.getElementById("formSelector");
      const formName = document.getElementById("formName");
      const prevForm = document.getElementById("prevForm");
      const nextForm = document.getElementById("nextForm");
      const shinyToggle = document.getElementById("shinyToggle");

      const forms = getPokemonForms(pokemon);
      const shinyAvailability = new Map();
      let currentFormIndex = 0;
      let showingShiny = false;

      async function renderForm() {
        const form = forms[currentFormIndex];
        const normalImage = form.image || "assets/img/_placeholder.png";
        const shinyImage = getShinyPath(normalImage);

        let hasShiny = shinyAvailability.get(shinyImage);

        if (hasShiny === undefined) {
          shinyToggle.style.display = "none";
          hasShiny = await imageExists(shinyImage);
          shinyAvailability.set(shinyImage, hasShiny);

          if (form !== forms[currentFormIndex]) return;
        }

        if (!hasShiny) showingShiny = false;

        img.src = showingShiny && hasShiny ? shinyImage : normalImage;
        img.alt = `${pokemon.name} - ${form.name || "Normal"}${showingShiny ? " shiny" : ""}`;
        formName.textContent = form.name || "Normal";

        const hasMultipleForms = forms.length > 1;
        formSelector.style.display = hasMultipleForms ? "" : "none";
        prevForm.style.display = hasMultipleForms ? "" : "none";
        nextForm.style.display = hasMultipleForms ? "" : "none";

        shinyToggle.style.display = hasShiny ? "" : "none";
        shinyToggle.classList.toggle("active", showingShiny);
        shinyToggle.setAttribute(
          "aria-label",
          showingShiny ? "Mostrar versión normal" : "Mostrar versión shiny"
        );
        shinyToggle.title = showingShiny
          ? "Mostrar versión normal"
          : "Mostrar versión shiny";
      }

      img.onerror = () => {
        const form = forms[currentFormIndex];

        if (showingShiny) {
          showingShiny = false;
          shinyAvailability.set(getShinyPath(form.image), false);
          renderForm();
          return;
        }

        img.onerror = null;
        img.src = "assets/img/_placeholder.png";
      };

      shinyToggle.addEventListener("click", () => {
        showingShiny = !showingShiny;
        renderForm();
      });

      prevForm.addEventListener("click", () => {
        currentFormIndex = (currentFormIndex - 1 + forms.length) % forms.length;
        renderForm();
      });

      nextForm.addEventListener("click", () => {
        currentFormIndex = (currentFormIndex + 1) % forms.length;
        renderForm();
      });

      renderForm();

      const typesBox = document.getElementById("pokemonTypes");
      const types = Array.isArray(pokemon.types) ? pokemon.types : [];

      types.forEach(type => {
        const span = document.createElement("span");
        span.className = `chip ${typeClass(type)}`;
        span.textContent = type;
        typesBox.appendChild(span);
      });

      const facts = (pokemon.curiosidades || "").trim();

      if (facts && facts.toLowerCase() !== "nan") {
        document.getElementById("pokemonFacts").textContent = facts;
      } else {
        document.getElementById("factsPanel").style.display = "none";
      }

      const statsBox = document.getElementById("pokemonStats");

      const labels = {
        hp: "PS",
        atk: "Ataque",
        def: "Defensa",
        spa: "At. Esp.",
        spd: "Def. Esp.",
        spe: "Velocidad"
      };

      Object.entries(labels).forEach(([key, label]) => {
        const value = Number(pokemon.stats?.[key] ?? 0);
        const width = Math.min((value / 150) * 100, 100);

        statsBox.innerHTML += `
          <div class="stat-row">
            <span class="stat-name">${label}</span>
            <span class="stat-value">${value}</span>
            <div class="stat-bar">
              <div class="stat-fill" style="width:${width}%"></div>
            </div>
          </div>`;
      });

      const evoBox = document.getElementById("pokemonEvolutionLine");
      const evoPanel = document.getElementById("evolutionPanel");

      const evoIds = Array.isArray(pokemon.evolutionLine) ? pokemon.evolutionLine : [];

      const evoPokemon = evoIds
        .map(evoId => POKEMON.find(p => p.id === evoId))
        .filter(Boolean);

      if (evoPokemon.length) {
        evoBox.innerHTML = evoPokemon.map((p, index) => {
          const arrow = index < evoPokemon.length - 1
            ? `<span class="evo-arrow">→</span>`
            : "";

          return `
            <a class="evo-card" href="pokemon.html?id=${p.id}">
              <img src="${getDisplayImage(p)}" alt="${p.name}" onerror="this.src='assets/img/_placeholder.png'">
              <span>#${String(p.id).padStart(3, "0")}</span>
              <strong>${p.name}</strong>
            </a>
            ${arrow}
          `;
        }).join("");
      } else {
        evoPanel.style.display = "none";
      }

      document.addEventListener("keydown", event => {
        const activeTag = document.activeElement?.tagName;

        if (
          activeTag === "INPUT" ||
          activeTag === "TEXTAREA" ||
          document.activeElement?.isContentEditable
        ) return;

        if (event.key === "Escape") {
          event.preventDefault();
          window.location.href = "dex.html";
          return;
        }

        if (event.key === "s" || event.key === "S") {
          if (shinyToggle.style.display !== "none") {
            event.preventDefault();
            shinyToggle.click();
          }
          return;
        }

        if (event.key === "ArrowLeft") {
          event.preventDefault();

          if (forms.length > 1) {
            prevForm.click();
          } else if (navigation.previous) {
            window.location.href = `pokemon.html?id=${navigation.previous.id}`;
          }
          return;
        }

        if (event.key === "ArrowRight") {
          event.preventDefault();

          if (forms.length > 1) {
            nextForm.click();
          } else if (navigation.next) {
            window.location.href = `pokemon.html?id=${navigation.next.id}`;
          }
        }
      });
    }
  </script>
</body>
</html>
